
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTK Entry Test - 180 MCQs</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    margin:0;
    padding:15px;
}

.container{
    max-width:850px;
    margin:auto;
}

.card{
    background:white;
    padding:22px;
    margin:15px 0;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
}

.subject{
    display:inline-block;
    background:#e8efff;
    padding:7px 12px;
    border-radius:20px;
    font-size:14px;
}

.option{
    width:100%;
    text-align:left;
    padding:14px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:10px;
    background:white;
    font-size:16px;
    cursor:pointer;
}

.option:hover{
    background:#f1f4f8;
}

.correct{
    background:#d8f5df !important;
    border-color:green !important;
}

.wrong{
    background:#ffdede !important;
    border-color:red !important;
}

.feedback{
    font-weight:bold;
    margin:12px 0;
}

.next{
    display:none;
    padding:12px 20px;
    border:0;
    border-radius:9px;
    background:#1769e0;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.restart{
    padding:12px 20px;
    border:0;
    border-radius:9px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>MTK Entry Test</h1>

<p>
<b>180 MCQs</b>
</p>

<p>
Physics • Biochemistry •
